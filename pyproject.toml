[project]
name = "dbcomparator"
version = "0.1.0"
description = "Application is designed to compare relational databases"
authors = [
    { name = "Pavel Kiselev", email = "pal_andreich@mail.ru"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymysql>=1.1.1",
    "pyqt5>=5.15.7",
    "sqlalchemy>=1.4.46",
    "pandas>=1.5.3",
    "pylint>=2.15.10",
    "jinja2>=3.1.6",
    "cryptography (>=46.0.7, <49.0.0)"
]

[dependency-groups]
test = [
    "pytest>=9.0.3",
    "sqlalchemy==1.4.46",
    "mypy"
]
lint = [
    "pylint>=2.15.10",
    "mypy>=1.0.0",
    "radon>=5.1.0",
    "pre-commit>=3.1.1",
    "types-pymysql>=1.0.19.5"
]
dev = [
    { include-group = "test" },
    { include-group = "lint" }
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev]
optional = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
